map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

upstream riderguy_api {
    server 127.0.0.1:4000;
    keepalive 32;
}

upstream riderguy_marketing {
    server 127.0.0.1:3000;
    keepalive 16;
}

upstream riderguy_admin {
    server 127.0.0.1:3003;
    keepalive 16;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 444;
}

server {
    listen 80;
    listen [::]:80;
    server_name myriderguy.com www.myriderguy.com app.myriderguy.com rider.myriderguy.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://riderguy_marketing;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name admin.myriderguy.com;
    client_max_body_size 20m;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://riderguy_admin;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name api.myriderguy.com;
    client_max_body_size 25m;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location /socket.io/ {
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 75s;
        proxy_pass http://riderguy_api;
    }

    # StorageService returns /uploads/... URLs. Rewrite those requests to the
    # API's authenticated file route instead of exposing the directory.
    location /uploads/ {
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://riderguy_api/api/v1/uploads/;
    }

    location / {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://riderguy_api;
    }
}
