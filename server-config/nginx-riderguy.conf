map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

upstream riderguy_api {
    server 127.0.0.1:4000;
    keepalive 32;
}

upstream riderguy_marketing {
    server 127.0.0.1:3000;
    keepalive 16;
}

upstream riderguy_admin {
    server 127.0.0.1:3003;
    keepalive 16;
}

# Install this file after Certbot has issued a certificate covering every listed
# hostname. During initial issuance, use a temporary HTTP-only server block.
server {
    listen 80;
    listen [::]:80;
    server_name myriderguy.com www.myriderguy.com admin.myriderguy.com
                api.myriderguy.com app.myriderguy.com rider.myriderguy.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name myriderguy.com www.myriderguy.com;

    ssl_certificate /etc/letsencrypt/live/myriderguy.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/myriderguy.com/privkey.pem;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location / {
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://riderguy_marketing;
    }
}

# The former PWA hostnames no longer serve web applications. Keep temporary
# redirects until dedicated app-download pages are available.
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name app.myriderguy.com rider.myriderguy.com;

    ssl_certificate /etc/letsencrypt/live/myriderguy.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/myriderguy.com/privkey.pem;

    return 302 https://myriderguy.com/;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name admin.myriderguy.com;

    ssl_certificate /etc/letsencrypt/live/myriderguy.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/myriderguy.com/privkey.pem;

    client_max_body_size 20m;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;

    location / {
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://riderguy_admin;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.myriderguy.com;

    ssl_certificate /etc/letsencrypt/live/myriderguy.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/myriderguy.com/privkey.pem;

    client_max_body_size 25m;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;

    location /socket.io/ {
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 75s;
        proxy_pass http://riderguy_api;
    }

    location /uploads/ {
        alias /var/www/riderguy/uploads/;
        try_files $uri =404;
        add_header X-Content-Type-Options nosniff always;
    }

    location / {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://riderguy_api;
    }
}

